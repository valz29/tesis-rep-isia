# Reuse the eye mark shown on Retinazo's welcome screen.
# Regenerate with: dart run tool/generate_icons.dart
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/retinazo-eye.png
  min_sdk_android: 24
  adaptive_icon_background: '#F2F6F6'
  adaptive_icon_foreground: assets/branding/retinazo-eye.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: '#F2F6F6'
