<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="2600" viewBox="0 0 3600 2600">
<title>Retinazo: componentes y responsabilidades</title>
<desc>Flutter con Dart usa Supabase Auth y PostgreSQL. FastAPI, alojado en Render, valida el acceso y usa Boto3 para almacenar imágenes en Cloudflare R2. La aplicación descarga imágenes con enlaces firmados.</desc>
