<text x="240" y="1680.5" font-family="DejaVu Sans, sans-serif" font-size="47" font-weight="700" fill="#ffffff">Cloudflare R2</text>
<text x="240" y="1732.8" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#e0f6ee">Almacenamiento de objetos · bucket privado</text>
<rect x="144" y="1820" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="172" y="1836.2" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#183c3b">Guarda las imágenes originales JPEG/PNG.</text>
<rect x="144" y="1880.44" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="172" y="1896.7" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#183c3b">Bucket de la aplicación: retinazo-retinas.</text>
<rect x="144" y="1940.88" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="172" y="1957.1" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#183c3b">API compatible con S3 y enlaces de lectura firmados.</text>
<text x="144" y="2035.8" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#c56c13">Boto3 se ejecuta en FastAPI; R2 recibe las operaciones S3.</text>
<rect x="140" y="2115" width="1240" height="174" rx="18" fill="#fff4e7" stroke="none" stroke-width="2"/>
<text x="166" y="2154.7" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#087f70">POR QUÉ SE ELIGIÓ</text>
<text x="166" y="2202.8" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#183c3b">Separa archivos y datos relacionales. Ofrece compatibilidad S3 y</text>
<text x="166" y="2244.0" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#183c3b">almacenamiento sin publicar el bucket.</text>
