<text x="2095" y="379.6" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#087f70">SB</text>
<text x="2190" y="370.5" font-family="DejaVu Sans, sans-serif" font-size="47" font-weight="700" fill="#ffffff">Supabase</text>
<text x="2190" y="422.8" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#e0f6ee">Plataforma gestionada: identidad + PostgreSQL</text>
<rect x="2085" y="500" width="650" height="610" rx="20" fill="#f7fbf9" stroke="#cbded8" stroke-width="2"/>
<rect x="2770" y="500" width="695" height="610" rx="20" fill="#f7fbf9" stroke="#cbded8" stroke-width="2"/>
<text x="2110" y="560.3" font-family="DejaVu Sans, sans-serif" font-size="37" font-weight="700" fill="#087f70">Supabase Auth</text>
<text x="2110" y="606.1" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#52716e">Servicio gestionado</text>
<rect x="2110" y="660" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="2138" y="673.0" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#183c3b">Crea y verifica cuentas.</text>
<rect x="2110" y="712.76" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="2138" y="725.7" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#183c3b">Confirma el correo electrónico.</text>
<rect x="2110" y="765.52" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="2138" y="778.5" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#183c3b">Gestiona contraseñas y sesión.</text>
<rect x="2110" y="818.28" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="2138" y="831.2" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#183c3b">Emite tokens de acceso JWT.</text>
<text x="2110" y="939.9" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#087f70">POR QUÉ SE ELIGIÓ</text>
<text x="2110" y="986.1" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#183c3b">Resuelve la identidad sin desarrollar un</text>
<text x="2110" y="1024.5" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#183c3b">sistema de autenticación propio.</text>
<text x="2795" y="560.3" font-family="DejaVu Sans, sans-serif" font-size="37" font-weight="700" fill="#087f70">PostgreSQL 17.11</text>
<text x="2795" y="606.1" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#52716e">Base de datos en Supabase</text>
<rect x="2795" y="660" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="2823" y="673.0" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#183c3b">Perfiles y roles: profiles.</text>
<rect x="2795" y="712.76" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="2823" y="725.7" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#183c3b">Pacientes: patients.</text>
<rect x="2795" y="765.52" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="2823" y="778.5" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#183c3b">Evaluaciones y metadatos.</text>
<rect x="2795" y="818.28" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="2823" y="831.2" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#183c3b">Relaciones y permisos RLS.</text>
<text x="2795" y="887.3" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#183c3b">profiles se vincula con auth.users</text>
<text x="2795" y="939.9" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#087f70">POR QUÉ SE ELIGIÓ</text>
<text x="2795" y="986.1" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#183c3b">Los datos tienen relaciones, integridad y</text>
<text x="2795" y="1024.5" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#183c3b">permisos por fila. Los archivos van en R2.</text>
<rect x="100" y="1619" width="1320" height="720" rx="30" fill="#e1ece8" stroke="none" stroke-width="2"/>
<rect x="100" y="1610" width="1320" height="720" rx="30" fill="#ffffff" stroke="#cbded8" stroke-width="3"/>
