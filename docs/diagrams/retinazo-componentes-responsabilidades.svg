<text x="172" y="584.1" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="400" fill="#183c3b">Vistas, formularios y navegación escritos en Dart.</text>
<rect x="144" y="631.86" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="172" y="648.9" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="400" fill="#183c3b">Acceso, registro, pacientes e historial de evaluaciones.</text>
<rect x="144" y="696.72" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="172" y="713.8" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="400" fill="#183c3b">Cámara o galería: tres imágenes de un mismo ojo.</text>
<rect x="144" y="761.58" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="172" y="778.6" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="400" fill="#183c3b">Controladores y casos de uso separados de los datos.</text>
<text x="144" y="846.1" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#52716e">Bibliotecas del cliente</text>
<text x="144" y="893.8" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#183c3b">supabase_flutter 2.18.3 · image_picker 1.2.3 · http 1.6.0</text>
<rect x="140" y="936" width="1240" height="174" rx="18" fill="#edf7f3" stroke="none" stroke-width="2"/>
<text x="166" y="975.7" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#087f70">POR QUÉ SE ELIGIÓ</text>
<text x="166" y="1024.6" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#183c3b">Permite compartir el código móvil y acceder a funciones del teléfono, con una</text>
<text x="166" y="1067.2" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#183c3b">interfaz consistente.</text>
