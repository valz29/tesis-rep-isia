<text x="505" y="132.3" font-family="DejaVu Sans, sans-serif" font-size="65" font-weight="700" fill="#183c3b">Componentes y responsabilidades</text>
<text x="103" y="205.7" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#52716e">Arquitectura implementada · aplicación móvil, identidad, datos y almacenamiento</text>
