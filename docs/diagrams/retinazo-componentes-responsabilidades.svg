<text x="2190" y="1732.8" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#e0f6ee">Alojado en Render · contenedor Docker · Python 3.12</text>
<rect x="2094" y="1820" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="2122" y="1834.6" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#183c3b">Valida la sesión de Supabase y el acceso a la evaluación.</text>
<rect x="2094" y="1874.6" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="2122" y="1889.2" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#183c3b">Comprueba las tres imágenes, su formato, tamaño e integridad.</text>
<rect x="2094" y="1929.1999999999998" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="2122" y="1943.8" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#183c3b">Guarda en R2 con Boto3 y confirma sus referencias en SQL.</text>
<rect x="2094" y="1983.7999999999997" width="9" height="9" rx="4" fill="#087f70" stroke="none" stroke-width="2"/>
<text x="2122" y="1998.4" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#183c3b">Entrega enlaces temporales para consultar las imágenes.</text>
<text x="2094" y="2071.3" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#183c3b">Boto3 1.43.124 · Uvicorn 0.54.0 · HTTPX 0.28.1 · Pillow 12.3.0</text>
<rect x="2090" y="2115" width="1370" height="174" rx="18" fill="#edf7f3" stroke="none" stroke-width="2"/>
<text x="2116" y="2154.7" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#087f70">POR QUÉ SE ELIGIÓ</text>
<text x="2116" y="2202.8" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#183c3b">Python facilita la futura integración del modelo. Render ejecuta la API en la nube sin</text>
<text x="2116" y="2244.0" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#183c3b">depender de tu PC.</text>
