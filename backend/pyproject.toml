[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retinazo-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1",
  "boto3>=1.35,<2", "pillow>=11,<13", "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["retinazo_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
